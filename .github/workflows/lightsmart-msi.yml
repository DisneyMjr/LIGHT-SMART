name: Gerar MSI Light Smart

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msi:
    name: Windows x64 MSI
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Instalar WiX 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix --version
      - name: Gerar MSI
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Publicar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: LightSmart-Windows-x64
          path: |
            dist/release/*.msi
            dist/release/*portable.zip
          if-no-files-found: error
